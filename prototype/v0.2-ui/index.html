  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#/home" data-nav="home" aria-label="SceneLingo 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect x="3" y="6" width="26" height="20" rx="4"/><path d="M3 11h26M8 6v5M16 6v5M24 6v5"/><path d="M13 15.2v6.2l6-3.1z" class="brand-play"/></svg>
        </span>
        <span class="brand-copy"><strong>SceneLingo</strong><small>看剧 · 学英语</small></span>
      </a>

      <nav class="side-nav" aria-label="主导航">
        <a href="#/home" data-nav="home" class="nav-item" aria-current="page">
          <svg class="icon"><use href="#i-home"/></svg><span>学习首页</span>
        </a>
        <a href="#/materials" data-nav="materials" class="nav-item">
          <svg class="icon"><use href="#i-library"/></svg><span>学习资料库</span>
        </a>
        <a href="#/workbench" data-nav="workbench" class="nav-item">
          <svg class="icon"><use href="#i-film"/></svg><span>学习工作台</span>
        </a>
        <a href="#/vocabulary" data-nav="vocabulary" class="nav-item">
          <svg class="icon"><use href="#i-book"/></svg><span>生词库</span>
          <em class="nav-count" id="navVocabCount">16</em>
        </a>
        <a href="#/stats" data-nav="stats" class="nav-item">
          <svg class="icon"><use href="#i-chart"/></svg><span>学习统计</span>
        </a>
        <a href="#/settings" data-nav="settings" class="nav-item">
          <svg class="icon"><use href="#i-settings"/></svg><span>设置</span>
        </a>
      </nav>

      <div class="side-spacer"></div>

      <div class="streak-card">
        <svg class="icon"><use href="#i-flame"/></svg>
        <div><strong>12 天</strong><small>连续学习</small></div>
      </div>

      <div class="profile">
        <span class="avatar" aria-hidden="true">L</span>
        <div class="profile-copy"><strong>本地学习者</strong><small>原型 · 模拟数据</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <p class="eyebrow" id="pageEyebrow">今天的学习</p>
          <h1 id="pageTitle">学习首页</h1>
        </div>
        <div class="topbar-meta">
          <span class="demo-badge"><i></i>原型 · 模拟数据</span>
          <span class="today" id="todayLabel"></span>
        </div>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <div class="word-popover" id="wordPopover" role="dialog" aria-modal="false" aria-label="单词详情" hidden></div>
  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">该原型需要 JavaScript 才能运行。</p></noscript>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
